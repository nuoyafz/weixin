name: smoke

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies (smoke minimal set)
        # 仅装 smoke 测试采集阶段真正 import 到的包：
        # - pyyaml / requests / pytest：基础依赖
        # - numpy：wechat_sender / red_dot_detector 的顶层依赖
        # - Pillow：red_dot_detector 顶层 `from PIL import Image`（置顶点击路径测试必需）
        #   以上均有 manylinux 预编译 wheel，安装极稳。
        # 应用重依赖（torch / opencv / rapidocr / omegaconf 等）均为惰性导入，
        # 不在采集阶段加载，故无需安装——装了反而增加 Linux 装包失败的风险。
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir pyyaml requests pytest numpy Pillow

      - name: Diagnostic - verify core imports
        # 跑测试前先单独验证核心模块能导入，失败则给出清晰的错误来源。
        # src.rpa 之前会因顶层 `import win32con`（human_like_mouse）在
        # Linux runner 上崩掉，拖死整个 smoke job —— 这里显式探一次，
        # 让该回归一眼可见（pywin32 已改为可选依赖）。
        run: |
          python -c "import sys; sys.path.insert(0, '.'); import src.config.settings, src.ai.text_model_client; print('IMPORT OK')"
          python -c "import sys; sys.path.insert(0, '.'); import src.rpa, src.rpa.wechat_sender; print('RPA IMPORT OK')"

      - name: Run smoke tests
        env:
          VISREPLY_API_KEY: "${{ secrets.VISREPLY_API_KEY }}"
        run: python -m pytest tests/smoke -vv
