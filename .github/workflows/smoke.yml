name: smoke

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies (smoke minimal set)
        # 仅装 smoke 测试采集阶段真正 import 到的包：
        # - pyyaml / requests / pytest：基础依赖
        # - numpy：wechat_sender 的顶层依赖（发送路径测试必需）。
        #   它有 manylinux 预编译 wheel，安装极稳；且测试内已用
        #   pytest.importorskip 兜底，万一缺失只会 skip 不会把 job 搞红。
        # 应用重依赖（torch / opencv / rapidocr / omegaconf 等）均为惰性导入，
        # 不在采集阶段加载，故无需安装——装了反而增加 Linux 装包失败的风险。
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir pyyaml requests pytest numpy

      - name: Diagnostic - verify core imports
        # 跑测试前先单独验证两个核心模块能导入，失败则给出清晰的错误来源。
        run: python -c "import sys; sys.path.insert(0, '.'); import src.config.settings, src.ai.text_model_client; print('IMPORT OK')"

      - name: Run smoke tests
        env:
          VISREPLY_API_KEY: "${{ secrets.VISREPLY_API_KEY }}"
        run: python -m pytest tests/smoke -vv
