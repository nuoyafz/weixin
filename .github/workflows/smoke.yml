name: smoke

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: System deps for OpenCV (headless)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0

      - name: Install dependencies (smoke 最小集)
        # 只装 smoke 必需的纯 Python 依赖，避开 pywebview/opencv/rapidocr 等
        # Windows 桌面重包——既加速 CI，也避免 Linux 上不必要的装包失败。
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml requests numpy omegaconf colorlog

      - name: Run smoke tests
        env:
          VISREPLY_API_KEY: ${{ secrets.VISREPLY_API_KEY }}
        run: python -m pytest tests/smoke -q
